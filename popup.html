<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copy text with Alt-Click</title>
    <style>
        :root {
            color-scheme: light dark;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

            /* ── Light tokens ── */
            --bg-a: rgba(14, 165, 233, 0.16);
            --bg-b: #f8fbff;
            --bg-c: #eef6ff;
            --surface: rgba(255, 255, 255, 0.82);
            --surface-strong: rgba(255, 255, 255, 0.92);
            --surface-item: rgba(248, 250, 252, 0.9);
            --border: rgba(148, 163, 184, 0.28);
            --border-strong: rgba(148, 163, 184, 0.45);
            --border-item: rgba(226, 232, 240, 0.95);
            --text: #0f172a;
            --text-secondary: #334155;
            --muted: #64748b;
            --accent: #0f766e;
            --accent-alt: #0369a1;
            --accent-surface: rgba(15, 118, 110, 0.08);
            --accent-border: rgba(15, 118, 110, 0.22);
            --badge-ok-bg: rgba(16, 185, 129, 0.14);
            --badge-ok-fg: #047857;
            --badge-err-bg: rgba(239, 68, 68, 0.14);
            --badge-err-fg: #b91c1c;
            --badge-mute-bg: rgba(148, 163, 184, 0.18);
            --badge-mute-fg: #475569;
            --shadow: 0 10px 28px rgba(15, 23, 42, 0.08);
            --shadow-btn: 0 10px 24px rgba(8, 47, 73, 0.18);
            --chip-bg: rgba(255, 255, 255, 0.92);
            --chip-border: rgba(203, 213, 225, 0.9);
            --chip-native-fg: #475569;
            --chip-native-border: rgba(148, 163, 184, 0.35);
            --chip-native-bg: rgba(148, 163, 184, 0.12);
            --focus-ring: rgba(14, 165, 233, 0.5);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-a: rgba(14, 165, 233, 0.06);
                --bg-b: #0c1222;
                --bg-c: #0f172a;
                --surface: rgba(30, 41, 59, 0.82);
                --surface-strong: rgba(30, 41, 59, 0.96);
                --surface-item: rgba(30, 41, 59, 0.72);
                --border: rgba(100, 116, 139, 0.22);
                --border-strong: rgba(100, 116, 139, 0.38);
                --border-item: rgba(51, 65, 85, 0.7);
                --text: #e2e8f0;
                --text-secondary: #cbd5e1;
                --muted: #94a3b8;
                --accent: #2dd4bf;
                --accent-alt: #38bdf8;
                --accent-surface: rgba(45, 212, 191, 0.1);
                --accent-border: rgba(45, 212, 191, 0.22);
                --badge-ok-bg: rgba(45, 212, 191, 0.16);
                --badge-ok-fg: #2dd4bf;
                --badge-err-bg: rgba(248, 113, 113, 0.16);
                --badge-err-fg: #f87171;
                --badge-mute-bg: rgba(100, 116, 139, 0.2);
                --badge-mute-fg: #94a3b8;
                --shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
                --shadow-btn: 0 10px 24px rgba(0, 0, 0, 0.35);
                --chip-bg: rgba(30, 41, 59, 0.9);
                --chip-border: rgba(51, 65, 85, 0.7);
                --chip-native-fg: #94a3b8;
                --chip-native-border: rgba(100, 116, 139, 0.35);
                --chip-native-bg: rgba(51, 65, 85, 0.4);
                --focus-ring: rgba(56, 189, 248, 0.5);
            }
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-width: 340px;
            background:
                radial-gradient(circle at top right, var(--bg-a), transparent 42%),
                linear-gradient(180deg, var(--bg-b) 0%, var(--bg-c) 100%);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }

        .panel {
            padding: 16px;
            display: grid;
            gap: 14px;
        }

        .hero,
        .card {
            border: 1px solid var(--border);
            border-radius: 16px;
            background: var(--surface);
            box-shadow: var(--shadow);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .hero {
            padding: 14px 14px 12px;
            display: grid;
            gap: 6px;
        }

        .eyebrow {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--accent);
        }

        .title {
            font-size: 16px;
            font-weight: 700;
        }

        .subtitle {
            font-size: 12px;
            line-height: 1.5;
            color: var(--muted);
        }

        .card {
            padding: 14px;
            display: grid;
            gap: 12px;
        }

        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .stack {
            display: grid;
            gap: 4px;
        }

        .label {
            font-size: 13px;
            font-weight: 650;
            color: var(--text-secondary);
        }

        .hint {
            font-size: 12px;
            line-height: 1.45;
            color: var(--muted);
        }

        .domain {
            font-size: 14px;
            font-weight: 700;
            word-break: break-word;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.02em;
            white-space: nowrap;
            transition: transform 200ms ease;
        }

        .badge.active {
            background: var(--badge-ok-bg);
            color: var(--badge-ok-fg);
        }

        .badge.excluded {
            background: var(--badge-err-bg);
            color: var(--badge-err-fg);
        }

        .badge.unsupported {
            background: var(--badge-mute-bg);
            color: var(--badge-mute-fg);
        }

        .control {
            width: 100%;
            font: inherit;
            color: var(--text);
            background: var(--surface-strong);
            border: 1px solid var(--border-strong);
            border-radius: 12px;
            padding: 10px 12px;
            transition: border-color 200ms ease, box-shadow 200ms ease;
        }

        .control:hover {
            border-color: var(--accent);
        }

        .control:focus-visible {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--focus-ring);
        }

        .button {
            font: inherit;
            cursor: pointer;
            border: 0;
            border-radius: 12px;
            padding: 10px 12px;
            font-weight: 600;
            transition: transform 200ms cubic-bezier(0.22, 1, 0.36, 1),
                        box-shadow 200ms ease,
                        opacity 200ms ease,
                        background 200ms ease;
        }

        .button:hover {
            transform: translateY(-1px);
        }

        .button:active {
            transform: translateY(0) scale(0.98);
        }

        .button:focus-visible {
            outline: 2px solid var(--focus-ring);
            outline-offset: 2px;
        }

        .button.primary {
            color: #ecfeff;
            background: linear-gradient(135deg, var(--accent), var(--accent-alt));
            box-shadow: var(--shadow-btn);
        }

        .button.primary:hover {
            box-shadow: var(--shadow-btn), 0 0 0 1px var(--accent);
        }

        .button.secondary {
            color: var(--text);
            background: var(--surface-strong);
            border: 1px solid var(--border-strong);
        }

        .button.secondary:hover {
            border-color: var(--accent-border);
            background: var(--accent-surface);
        }

        .button:disabled {
            cursor: not-allowed;
            opacity: 0.45;
            transform: none;
            box-shadow: none;
        }

        .toggle {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            padding: 6px 2px;
            border-radius: 10px;
            transition: background 200ms ease;
        }

        .toggle:hover {
            background: var(--accent-surface);
        }

        .toggle input {
            width: 18px;
            height: 18px;
            margin: 0;
            accent-color: var(--accent);
        }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .status {
            min-height: 18px;
            font-size: 12px;
            font-weight: 600;
            color: var(--accent);
            transition: opacity 300ms ease;
        }

        .history-list {
            display: grid;
            gap: 10px;
            max-height: 280px;
            overflow: auto;
        }

        .history-item {
            display: grid;
            gap: 12px;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--border-item);
            background: var(--surface-item);
            transition: border-color 200ms ease, transform 200ms cubic-bezier(0.22, 1, 0.36, 1);
        }

        .history-item:hover {
            border-color: var(--accent-border);
            transform: translateY(-1px);
        }

        .history-top {
            display: flex;
            justify-content: space-between;
            align-items: start;
            gap: 10px;
        }

        .history-snippet {
            font-size: 12px;
            line-height: 1.55;
            color: var(--text);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .history-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .history-chip {
            display: inline-flex;
            align-items: center;
            padding: 4px 8px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
            line-height: 1;
            color: var(--muted);
            background: var(--chip-bg);
            border: 1px solid var(--chip-border);
        }

        .history-chip.source-extension,
        .history-chip.source-shortcut,
        .history-chip.source-history {
            color: var(--accent);
            border-color: var(--accent-border);
            background: var(--accent-surface);
        }

        .history-chip.source-native {
            color: var(--chip-native-fg);
            border-color: var(--chip-native-border);
            background: var(--chip-native-bg);
        }

        .history-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .button.small {
            padding: 7px 10px;
            border-radius: 10px;
            font-size: 12px;
        }

        /* ── Empty state ── */
        .empty-state {
            text-align: center;
            padding: 24px 16px;
            color: var(--muted);
        }

        .empty-state-icon {
            font-size: 28px;
            margin-bottom: 6px;
            opacity: 0.45;
        }

        .empty-state-text {
            font-size: 12px;
            line-height: 1.5;
        }

        .empty-state-hint {
            font-size: 11px;
            margin-top: 4px;
            opacity: 0.7;
        }

        /* ── Scrollbar ── */
        .history-list {
            scrollbar-width: thin;
            scrollbar-color: var(--border-strong) transparent;
        }

        .history-list::-webkit-scrollbar {
            width: 6px;
        }

        .history-list::-webkit-scrollbar-track {
            background: transparent;
        }

        .history-list::-webkit-scrollbar-thumb {
            background: var(--border-strong);
            border-radius: 999px;
        }

        .history-list::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }

        /* ── Select dark mode ── */
        @media (prefers-color-scheme: dark) {
            select.control option {
                background: #1e293b;
                color: #e2e8f0;
            }
        }

        /* ── Reduced motion ── */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <div class="panel">
        <section class="hero">
            <div class="eyebrow" id="popup_eyebrow">Quick controls</div>
            <div class="title" id="popup_title">Copy text with Alt-Click</div>
            <div class="subtitle" id="popup_subtitle">Tweak the current site and the most-used interaction settings without opening the full options page.</div>
        </section>

        <section class="card">
            <div class="row">
                <div class="stack">
                    <div class="label" id="popup_site_label">Current site</div>
                    <div class="domain" id="current_site">-</div>
                </div>
                <span class="badge unsupported" id="current_site_status">Unsupported</span>
            </div>
            <button class="button primary" id="toggle_site" type="button" disabled aria-label="Toggle copy for current site">Toggle site</button>
        </section>

        <section class="card">
            <div class="stack">
                <label class="label" id="popup_modifier_label" for="popup_meta_key">Copy modifier</label>
                <select class="control" id="popup_meta_key">
                    <option value="Alt">Alt + Click</option>
                    <option value="Ctrl">Ctrl + Click</option>
                    <option value="Shift">Shift + Click</option>
                </select>
            </div>

            <label class="toggle">
                <input type="checkbox" id="popup_preview_enabled">
                <span class="stack">
                    <span class="label" id="popup_preview_label">Hover preview</span>
                    <span class="hint" id="popup_preview_hint">Show the target overlay while the modifier key is held.</span>
                </span>
            </label>

            <label class="toggle">
                <input type="checkbox" id="popup_avoid_editable">
                <span class="stack">
                    <span class="label" id="popup_safe_label">Skip editable apps</span>
                    <span class="hint" id="popup_safe_hint">Avoid copying inside contenteditable editors and rich text surfaces.</span>
                </span>
            </label>

            <div class="stack">
                <label class="label" id="popup_duration_label" for="popup_toast_duration">Feedback duration</label>
                <input class="control" id="popup_toast_duration" type="number" min="300" max="8000" step="100" />
            </div>

            <div class="stack">
                <label class="label" id="copy_history_limit_label" for="popup_copy_history_limit">Saved history items</label>
                <input class="control" id="popup_copy_history_limit" type="number" min="0" max="9999" step="1" />
                <div class="hint" id="popup_append_hint">Quick controls for copy behavior, preview safety, and recent history.</div>
            </div>
        </section>

        <section class="card">
            <div class="row">
                <div class="label" id="popup_history_title">Recent copies</div>
                <button class="button secondary small" id="clear_history" type="button" aria-label="Clear copy history">Clear history</button>
            </div>
            <div class="history-list" id="history_list" role="list" aria-label="Recent copy history"></div>
        </section>

        <div class="footer">
            <button class="button secondary" id="open_options" type="button" aria-label="Open full extension settings">Open full settings</button>
            <span class="status" id="popup_status"></span>
        </div>
    </div>

    <script src="shared.js"></script>
    <script src="popup.js"></script>
</body>
</html>
