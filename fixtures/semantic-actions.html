<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copy Extension Fixture - Semantic Actions</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            margin: 40px auto;
            max-width: 760px;
            padding: 0 20px 80px;
            line-height: 1.5;
        }
        .result {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 12px;
            align-items: start;
            padding: 20px 0;
            border-bottom: 1px solid #dbe4ee;
        }
        .result a {
            font-size: 1.2rem;
        }
        button, [role="button"], [role="menuitem"] {
            width: 36px;
            height: 36px;
            display: inline-grid;
            place-items: center;
            border: 1px solid #cbd5e1;
            border-radius: 999px;
            background: white;
        }
        svg, img, input[type="image"] {
            width: 18px;
            height: 18px;
        }
        #nested-action {
            width: max-content;
            height: auto;
            margin: 12px 0;
            padding: 8px 12px;
        }
    </style>
</head>
<body>
    <h1>Semantic action scenarios</h1>

    <article class="result">
        <div>
            <a id="result-link" href="https://example.com/search-result">Example search result</a>
            <p>This neighboring result text must never be copied from its icon-only menu.</p>
        </div>
        <button id="result-menu" type="button" aria-label="About this result" title="Fallback title">
            <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
                <circle cx="12" cy="5" r="1.5"></circle>
                <circle cx="12" cy="12" r="1.5"></circle>
                <circle cx="12" cy="19" r="1.5"></circle>
            </svg>
        </button>
    </article>

    <span id="labelled-action-name" hidden>Referenced action label</span>
    <span id="document-only-label" hidden>Document secret</span>
    <span id="document-leak-label" hidden>Leaked document label</span>
    <button id="labelled-action" type="button" aria-labelledby="labelled-action-name" aria-label="Ignored aria label" title="Ignored title">
        <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false"><path d="M4 12h16"></path></svg>
    </button>

    <button id="unlabelled-action" type="button">
        <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false"><circle cx="12" cy="12" r="5"></circle></svg>
        <img aria-hidden="true" alt="Decorative icon" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=">
    </button>

    <div id="role-button-action" role="button" tabindex="0" aria-label="Role button action">
        <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false"><path d="M6 12h12"></path></svg>
    </div>

    <div id="role-menuitem-action" role="menuitem" tabindex="0" title="Role menu item action">
        <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false"><path d="M12 6v12"></path></svg>
    </div>

    <button id="image-alt-action" type="button">
        <img alt="Download report" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=">
    </button>

    <a id="image-alt-link" href="https://example.com/image-docs">
        <img alt="Documentation image" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=">
    </a>

    <input id="image-input-action" type="image" alt="Submit image action" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=">

    <div id="shadow-action-host">
        <span id="shadow-slotted-icon">
            <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false"><path d="M5 12h14"></path></svg>
        </span>
    </div>

    <div id="shadow-text-action-host"><span>Slotted Action</span></div>
    <div id="shadow-scoped-label-host"></div>
    <div id="shadow-input-host"></div>
    <div id="shadow-image-action-host"><img alt="Slotted image action" src="data:image/gif;base64,R0lGODlhAQABAAAAACw="></div>
    <div id="shadow-editor-host"></div>
    <div id="shadow-range-host"></div>

    <div id="nested-action" role="button" tabindex="0" aria-label="Outer card action">
        <a id="nested-action-link" href="https://example.com/nested-docs">Nested documentation</a>
    </div>

    <button id="hidden-descendant-action" type="button">
        <span><span style="display: none">Hidden account token</span></span>
        <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false"><path d="M8 12h8"></path></svg>
    </button>

    <p>
        <a id="icon-link" href="https://example.com/icon-docs" aria-label="Open documentation">
            <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
        </a>
        <a id="url-only-link" href="https://example.com/url-only">
            <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false"><path d="M8 12h8"></path></svg>
        </a>
    </p>

    <script>
        window.fixtureActionClickCount = 0;
        const shadowRoot = document.getElementById("shadow-action-host").attachShadow({ mode: "open" });
        shadowRoot.innerHTML = `
            <style>button { width: 36px; height: 36px; } ::slotted(*) { display: inline-grid; }</style>
            <button id="shadow-action-button" type="button" aria-label="Shadow slot action"><slot></slot></button>
        `;
        document.querySelectorAll("button, [role='button'], [role='menuitem'], input[type='image']").forEach(function (action) {
            action.addEventListener("click", function () {
                window.fixtureActionClickCount += 1;
            });
        });
        shadowRoot.getElementById("shadow-action-button").addEventListener("click", function () {
            window.fixtureActionClickCount += 1;
        });

        const textActionRoot = document.getElementById("shadow-text-action-host").attachShadow({ mode: "open" });
        textActionRoot.innerHTML = `<button id="shadow-text-action-button" type="button"><slot></slot></button>`;

        const scopedLabelRoot = document.getElementById("shadow-scoped-label-host").attachShadow({ mode: "open" });
        scopedLabelRoot.innerHTML = `
            <span id="document-only-label">Shadow scoped label</span>
            <button id="shadow-scoped-label-button" type="button" aria-labelledby="document-only-label"></button>
            <button id="shadow-out-of-scope-button" type="button" aria-labelledby="document-leak-label" title="Shadow title fallback"></button>
        `;

        const inputRoot = document.getElementById("shadow-input-host").attachShadow({ mode: "open" });
        inputRoot.innerHTML = `<input id="shadow-selection-input" value="abcdef">`;

        const imageActionRoot = document.getElementById("shadow-image-action-host").attachShadow({ mode: "open" });
        imageActionRoot.innerHTML = `<button id="shadow-image-action-button" type="button"><slot></slot></button>`;

        const editorRoot = document.getElementById("shadow-editor-host").attachShadow({ mode: "open" });
        editorRoot.innerHTML = `<div id="shadow-editor" contenteditable="true">Shadow editable secret</div>`;

        const rangeRoot = document.getElementById("shadow-range-host").attachShadow({ mode: "open" });
        rangeRoot.innerHTML = `<p id="shadow-range-text">abcdef</p>`;

        [textActionRoot, scopedLabelRoot, imageActionRoot].forEach(function (root) {
            root.querySelectorAll("button").forEach(function (button) {
                button.addEventListener("click", function () {
                    window.fixtureActionClickCount += 1;
                });
            });
        });
    </script>
</body>
</html>
