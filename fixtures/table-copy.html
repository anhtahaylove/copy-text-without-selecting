<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copy Extension Fixture - Table TSV</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            margin: 40px auto;
            max-width: 960px;
            padding: 0 20px 80px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 24px;
        }
        th, td {
            border: 1px solid #cbd5e1;
            padding: 10px 12px;
            text-align: left;
        }
        .hidden-cell {
            display: none;
        }
    </style>
</head>
<body>
    <h1>Table extraction scenarios</h1>
    <p>Click inside the table without selecting text to verify whole-table TSV export.</p>

    <table>
        <thead>
            <tr>
                <th>Product</th>
                <th>Owner</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Editor Suite</td>
                <td>Ana</td>
                <td>Beta</td>
            </tr>
            <tr>
                <td>Analytics Hub</td>
                <td>Marco</td>
                <td>Live</td>
            </tr>
            <tr>
                <td>Docs Cloud</td>
                <td>Trang
                    <div>SEA Region</div>
                </td>
                <td>Planning</td>
                <td class="hidden-cell">Should not copy</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
