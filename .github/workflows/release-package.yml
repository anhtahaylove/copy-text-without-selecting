name: Release Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: release-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and attest Chrome ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Require a semantic-version tag ref
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            echo "Release Package must run from a tag ref." >&2
            echo "Retry with: gh workflow run release-package.yml --ref vX.Y.Z" >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Unsupported release tag: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify tag and package version
        shell: bash
        run: |
          set -euo pipefail

          tag_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          head_commit="$(git rev-parse HEAD)"
          package_version="$(node -p "require('./package.json').version")"

          if [[ "$tag_commit" != "$head_commit" ]]; then
            echo "$RELEASE_TAG does not resolve to the checked-out commit." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$head_commit" origin/master; then
            echo "$RELEASE_TAG must point to a commit reachable from origin/master." >&2
            exit 1
          fi
          if [[ "v$package_version" != "$RELEASE_TAG" ]]; then
            echo "package.json version $package_version does not match $RELEASE_TAG." >&2
            exit 1
          fi

          echo "ARCHIVE_NAME=copy-text-with-alt-click-chrome-${RELEASE_TAG}.zip" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run release gate and build package
        run: npm run verify:release

      - name: Verify generated checksum
        working-directory: dist
        run: sha256sum --check SHA256SUMS.txt

      - name: Attest Chrome ZIP
        uses: actions/attest@v4
        with:
          subject-path: dist/${{ env.ARCHIVE_NAME }}

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: chrome-release-${{ env.RELEASE_TAG }}
          path: |
            dist/${{ env.ARCHIVE_NAME }}
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
