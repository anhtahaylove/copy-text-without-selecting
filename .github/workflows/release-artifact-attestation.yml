name: Published Release Verification

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to verify (for example, v2.5.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: published-release-verification-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  verify-release-zip:
    name: Verify published Chrome ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Validate published release
        id: release
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Unsupported release tag: $RELEASE_TAG" >&2
            exit 1
          fi

          release_json="$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft,tagName)"

          if [[ "$(jq -r '.isDraft' <<<"$release_json")" != "false" ]]; then
            echo "Release $RELEASE_TAG must be published before attestation." >&2
            exit 1
          fi

          if [[ "$(jq -r '.tagName' <<<"$release_json")" != "$RELEASE_TAG" ]]; then
            echo "Resolved release tag does not match $RELEASE_TAG." >&2
            exit 1
          fi

          archive_name="copy-text-with-alt-click-chrome-${RELEASE_TAG}.zip"
          echo "archive_name=$archive_name" >> "$GITHUB_OUTPUT"

      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Rebuild Chrome package from the tag
        run: npm run pack:chrome

      - name: Download published release assets
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-assets
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "${{ steps.release.outputs.archive_name }}" \
            --pattern "SHA256SUMS.txt" \
            --dir release-assets

      - name: Verify checksum and clean rebuild
        shell: bash
        env:
          ARCHIVE_NAME: ${{ steps.release.outputs.archive_name }}
        run: |
          set -euo pipefail

          published_archive="release-assets/$ARCHIVE_NAME"
          rebuilt_archive="dist/$ARCHIVE_NAME"
          checksum_file="release-assets/SHA256SUMS.txt"

          test -f "$published_archive"
          test -f "$rebuilt_archive"
          test -f "$checksum_file"

          expected_checksum_line="$(sha256sum "$published_archive" | sed "s#  release-assets/#  #")"
          actual_checksum_line="$(tr -d '\r' < "$checksum_file")"
          if [[ "$actual_checksum_line" != "$expected_checksum_line" ]]; then
            echo "SHA256SUMS.txt does not match the published Chrome ZIP." >&2
            exit 1
          fi
          if ! cmp --silent "$rebuilt_archive" "$published_archive"; then
            echo "Published Chrome ZIP does not match a clean build from $RELEASE_TAG." >&2
            exit 1
          fi

      - name: Verify tag-bound artifact attestation
        shell: bash
        env:
          ARCHIVE_NAME: ${{ steps.release.outputs.archive_name }}
        run: |
          gh attestation verify "release-assets/$ARCHIVE_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-package.yml" \
            --source-ref "refs/tags/$RELEASE_TAG" \
            --deny-self-hosted-runners
