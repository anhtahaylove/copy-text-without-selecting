name: Release Artifact Attestation

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to verify and attest (for example, v2.5.0)
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: release-artifact-attestation-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  attest-release-zip:
    name: Verify and attest Chrome ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Validate published release
        id: release
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Unsupported release tag: $RELEASE_TAG" >&2
            exit 1
          fi

          release_json="$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft,tagName)"

          if [[ "$(jq -r '.isDraft' <<<"$release_json")" != "false" ]]; then
            echo "Release $RELEASE_TAG must be published before attestation." >&2
            exit 1
          fi

          if [[ "$(jq -r '.tagName' <<<"$release_json")" != "$RELEASE_TAG" ]]; then
            echo "Resolved release tag does not match $RELEASE_TAG." >&2
            exit 1
          fi

          archive_name="copy-text-with-alt-click-chrome-${RELEASE_TAG}.zip"
          echo "archive_name=$archive_name" >> "$GITHUB_OUTPUT"

      - name: Download published release assets
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-assets
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "${{ steps.release.outputs.archive_name }}" \
            --pattern "SHA256SUMS.txt" \
            --dir release-assets

      - name: Verify published checksum
        shell: bash
        env:
          ARCHIVE_NAME: ${{ steps.release.outputs.archive_name }}
        run: |
          set -euo pipefail

          published_archive="release-assets/$ARCHIVE_NAME"
          checksum_file="release-assets/SHA256SUMS.txt"

          test -f "$published_archive"
          test -f "$checksum_file"

          expected_checksum_line="$(sha256sum "$published_archive" | sed "s#  release-assets/#  #")"
          actual_checksum_line="$(tr -d '\r' < "$checksum_file")"
          if [[ "$actual_checksum_line" != "$expected_checksum_line" ]]; then
            echo "SHA256SUMS.txt does not match the published Chrome ZIP." >&2
            exit 1
          fi

      - name: Attest published Chrome ZIP
        uses: actions/attest@v4
        with:
          subject-path: release-assets/${{ steps.release.outputs.archive_name }}
