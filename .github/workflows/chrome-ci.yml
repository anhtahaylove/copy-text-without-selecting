name: Chrome CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Check syntax
        run: npm run check:syntax

      - name: Check manifest
        run: npm run check:manifest

      - name: Build Chrome package
        run: npm run build:chrome

  e2e:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run extension e2e tests
        run: npm run test:e2e

  windows-native:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: companion/go.mod
          cache-dependency-path: companion/go.sum

      - name: Install dependencies
        run: npm ci

      - name: Install Wails CLI
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
          "$env:USERPROFILE\go\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$env:USERPROFILE\go\bin\wails.exe" version

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Build Chrome package
        run: npm run build:chrome

      - name: Build Windows companion
        run: npm run native:build

      - name: Smoke native host protocol
        run: npm run native:test-host

      - name: Run native extension e2e
        run: npm run test:e2e:native
